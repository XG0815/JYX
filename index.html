<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="景怡轩沙发电子图册，布艺沙发线上款式查看">
  <meta name="keywords" content="景怡轩沙发,布艺沙发,家具图册">
  <title>景怡轩沙发 | 电子图册·臻品展示</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #faf8f5;
      color: #3e3a37;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 99;
      border-bottom: 1px solid #f0ebe4;
      gap: 1rem;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #6b5b4b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .logo i {
      color: #b2977a;
      font-size: 2rem;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-links a {
      text-decoration: none;
      color: #5f5549;
      font-weight: 500;
      font-size: 1rem;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .nav-links a:hover,.nav-links a.active {
      color: #b2977a;
    }
    .contact-btn {
      background: #d9c8b2;
      border: none;
      padding: 0.6rem 1.8rem;
      border-radius: 30px;
      font-weight: 600;
      color: #3e3a37;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }
    .contact-btn:hover {
      background: #c4ad94;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(178, 151, 122, 0.2);
    }
    .hero {
      text-align: center;
      padding: 3rem 2rem 2rem;
      background: linear-gradient(180deg, #fff 0%, #f7f3ed 100%);
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 500;
      color: #4e4338;
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.2rem;
      color: #8d7e6b;
      max-width: 600px;
      margin: 0 auto;
      font-weight: 300;
    }
    .filter-section {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      padding: 1.8rem 2rem;
      background: #fff;
      border-bottom: 1px solid #ede3d7;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid #dbcebf;
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      font-weight: 500;
      color: #5e5244;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .filter-btn:hover {
      background: #f3ede6;
      border-color: #b2977a;
    }
    .filter-btn.active {
      background: #b2977a;
      border-color: #b2977a;
      color: #fff;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      padding: 2.5rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .sofa-card {
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .sofa-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(180, 150, 120, 0.2);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #f2ede7;
      display: block;
      border-bottom: 1px solid #f1e9df;
      transition: scale 0.4s ease;
    }
    .sofa-card:hover .card-img {
      scale: 1.03;
    }
    .card-content {
      padding: 1.5rem 1.5rem 1.8rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .model-tag {
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: #b2977a;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .sofa-name {
      font-size: 1.6rem;
      font-weight: 500;
      color: #382e24;
      margin-bottom: 0.5rem;
    }
    .data-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.3rem;
      font-size: 0.9rem;
      color: #5c5144;
      background: #faf7f3;
      padding: 0.8rem;
      border-radius: 16px;
    }
    .data-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .data-item i {
      color: #b2977a;
      width: 1.2rem;
      text-align: center;
    }
    .detail-btn {
      margin-top: 1.2rem;
      background: transparent;
      border: 1px solid #b2977a;
      color: #6b5b4b;
      padding: 0.6rem 1rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: fit-content;
    }
    .detail-btn:hover {
      background: #b2977a;
      color: #fff;
    }
    .footer {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #8b7b6b;
      background: #f3efe9;
      font-size: 0.9rem;
      border-top: 1px solid #e2d7cb;
      margin-top: 2rem;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 32px;
      max-width: 700px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      box-shadow: 0 30px 50px rgba(0,0,0,0.3);
    }
    .close-modal {
      position: absolute;
      right: 1.5rem;
      top: 1.5rem;
      background: #f0e9df;
      border: none;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      color: #4e4338;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-modal:hover {
      background: #b2977a;
      color: #fff;
    }
    .modal-img {
      width: 100%;
      border-radius: 20px;
      max-height: 350px;
      object-fit: cover;
      margin-bottom: 1.5rem;
    }
    .modal h2 {
      font-size: 2rem;
      font-weight: 500;
    }
    .modal-specs {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin: 1.2rem 0;
      background: #faf7f3;
      padding: 1.2rem;
      border-radius: 20px;
    }
    @media (max-width:768px){
      .hero h1{font-size:2rem}
      .gallery-grid{grid-template-columns:1fr;padding:1.5rem 1rem;gap:1.5rem}
      .filter-section{padding:1.2rem 1rem;gap:0.8rem}
      .filter-btn{padding:0.6rem 1.2rem;font-size:0.88rem}
      .modal-content{padding:1.5rem}
    }
    @media (max-width:480px){
      .header{flex-direction:column;align-items:flex-start}
      .nav-links{width:100%;justify-content:flex-start;gap:1rem}
      .modal-specs{flex-direction:column;gap:0.6rem}
    }
  </style>
</head>
<body>
<header class="header">
  <div class="logo">
    <i class="fas fa-couch"></i> 景怡轩·沙发
  </div>
  <div class="nav-links">
    <a href="#" class="active"><i class="fas fa-book-open"></i> 电子图册</a>
    <a href="#"><i class="fas fa-star"></i> 新品</a>
    <a href="#"><i class="fas fa-palette"></i> 系列</a>
    <button class="contact-btn" id="contactBtn"><i class="fas fa-envelope"></i> 咨询顾问</button>
  </div>
</header>

<section class="hero">
  <h1>沉静美学 · 云端图册</h1>
  <p>景怡轩沙发 — 每一款，都是生活方式的数据诗篇</p>
</section>

<div class="filter-section">
  <button class="filter-btn active" data-filter="all"><i class="fas fa-th-large"></i> 全部系列</button>
  <button class="filter-btn" data-filter="fabric"><i class="fas fa-tshirt"></i> 布艺系列</button>
  <button class="filter-btn" data-filter="leather"><i class="fas fa-feather"></i> 真皮系列</button>
</div>

<main class="gallery-grid" id="sofaGrid"></main>

<div class="modal" id="sofaModal">
  <div class="modal-content">
    <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
    <img id="modalImage" class="modal-img" alt="沙发大图">
    <span class="model-tag" id="modalTag"></span>
    <h2 id="modalName"></h2>
    <div class="modal-specs" id="modalSpecs"></div>
    <button class="contact-btn" style="margin-top:1.5rem;" id="modalInquiryBtn"><i class="fas fa-paper-plane"></i> 索取详细规格</button>
  </div>
</div>

<footer class="footer">
  <p>© 2026 景怡轩沙发营销中心 · 电子图册展示 · 所有数据仅供参考</p>
  <p style="margin-top:0.3rem;"><i class="fas fa-phone-alt"></i> 13907145038  |  13971548795</p>
  <p style="margin-top:0.3rem;"><i class="fas fa-map-marker-alt"></i> 展厅地址：汉口北金马凯旋家居博览城CBD F馆1楼128号，欢迎到店体验</p>
</footer>

<script>
(function(){
  const sofas = [
    {
      id: 1,
      name: "#682",
      model: "#682",
      category: "fabric",
      image: "https://img2.nloln.de/file/BQACAgUAAyEGAASLVN5eAAJj2Gph-QHAQlyPe5knmm-2w_mbxTRiAAK_IAACIU4QV1ODvCxMlJDnPQQ.jpg",
      width: "300cm",
      depth: "102cm"
    }
  ];

  const grid = document.getElementById('sofaGrid');
  const modal = document.getElementById('sofaModal');
  const modalImage = document.getElementById('modalImage');
  const modalTag = document.getElementById('modalTag');
  const modalName = document.getElementById('modalName');
  const modalSpecs = document.getElementById('modalSpecs');

  function renderSofas(filter = 'all'){
    const list = filter === 'all' ? sofas : sofas.filter(item => item.category === filter);
    grid.innerHTML = list.map(sofa => `
      <div class="sofa-card" data-id="${sofa.id}">
        <img class="card-img" src="${sofa.image}" alt="${sofa.name}" loading="lazy"
        onerror="this.src='https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=600&h=400&fit=crop'">
        <div class="card-content">
          <span class="model-tag"><i class="far fa-bookmark"></i> ${sofa.model}</span>
          <h3 class="sofa-name">${sofa.name}</h3>
          <div class="data-row">
            <span class="data-item"><i class="fas fa-arrows-alt-h"></i> ${sofa.width}</span>
            <span class="data-item"><i class="fas fa-arrows-alt-v"></i> ${sofa.depth}</span>
          </div>
          <button class="detail-btn" data-id="${sofa.id}"><i class="fas fa-expand"></i> 查看详细数据</button>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.sofa-card').forEach(card=>{
      card.onclick = e=>{
        if(e.target.closest('.detail-btn')) return;
        openModal(card.dataset.id);
      }
    })
    grid.querySelectorAll('.detail-btn').forEach(btn=>{
      btn.onclick = e=>{
        e.stopPropagation();
        openModal(btn.dataset.id);
      }
    })
  }

  function openModal(id){
    const item = sofas.find(s=>s.id == id);
    if(!item) return;
    modalImage.src = item.image;
    modalTag.innerHTML = `<i class="far fa-bookmark"></i> ${item.model}`;
    modalName.textContent = item.name;
    modalSpecs.innerHTML = `
      <span><i class="fas fa-arrows-alt-h"></i> 长 ${item.width}</span>
      <span><i class="fas fa-arrows-alt-v"></i> 宽 ${item.depth}</span>
    `;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    modal.classList.remove('active');
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderSofas(btn.dataset.filter);
    }
  })

  document.getElementById('closeModalBtn').onclick = closeModal;
  modal.onclick = e=> e.target === modal && closeModal;

  function showContactDialog(){
    alert('感谢您关注景怡轩沙发！\n产品顾问为您提供完整图册、尺寸报价与面料色卡。\n咨询热线：13907145038 / 13971548795\n展厅地址：汉口北金马凯旋家居博览城CBD F馆1楼128号，欢迎线下实地体验！');
  }
  document.getElementById('contactBtn').onclick = showContactDialog;
  document.getElementById('modalInquiryBtn').onclick = showContactDialog;

  document.addEventListener('keydown',e=>{
    if(e.key === 'Escape' && modal.classList.contains('active')) closeModal();
  })

  renderSofas();
})();
</script>
</body>
</html>
